# x86-64-v3 is the x86 baseline: `simd` refuses a build without AVX2 and FMA.
[target.'cfg(target_arch = "x86_64")']
rustflags = ["-C", "target-cpu=x86-64-v3"]
rustdocflags = ["-C", "target-cpu=x86-64-v3"]

# `--workspace` in each lane: `default-members` holds `app` alone.
[alias]
gate-lint = "clippy --workspace --all-targets --all-features --keep-going -- -D warnings"
gate-lint-nogpu = "clippy --workspace --all-targets --features lumos/ml,lumos/real-data,common/introspect-derive,darkroom/profile-with-tracy --keep-going -- -D warnings"
gate-ship = "clippy --workspace --keep-going -- -D warnings"
# `-D warnings` through a `cfg(all())` entry, which cargo joins to the x86 flags above. `RUSTDOCFLAGS`
# would replace them, and `simd` refuses a build without them. A string, as `palantir` reads this
# file too and cargo refuses to merge a list with its string.
gate-doc = 'doc --workspace --no-deps --document-private-items --all-features --keep-going --config target."cfg(all())".rustdocflags=["-D","warnings"]'
# No `real-data`, which reads the gitignored dataset, nor `profile-with-tracy`, which opens the
# Tracy socket.
gate-test = "test --workspace --tests --no-fail-fast --features imaginarium/wgpu,lumos/ml,common/introspect-derive"
real-data = "test -p lumos --all-features"
mcp = "build -p darkroom-app --profile mcp"
# `--bench *`, not `--benches`, which also selects each library and binary.
bench-all = "bench --workspace --bench * --features imaginarium/wgpu"
bench-once = "test --workspace --bench * --features imaginarium/wgpu"
# `simd` alone: `libraw-sys` builds LibRaw's C++ for the target.
lint-x86 = "clippy -p simd --all-targets --all-features --target x86_64-unknown-linux-gnu -- -D warnings"
lint-aarch64 = "clippy -p simd --all-targets --all-features --target aarch64-unknown-linux-gnu -- -D warnings"
