# x86-64-v3 (Haswell, 2013; Excavator, 2015) is the x86 baseline: AVX2, FMA, BMI2 and F16C are
# static, `simd` refuses a build without AVX2 and FMA, and no code checks the CPU at run time.
# `cfg`-scoped rather than `[build]` so non-x86 targets aren't handed a CPU they aren't.
[target.'cfg(target_arch = "x86_64")']
rustflags = ["-C", "target-cpu=x86-64-v3"]
# Rustdoc compiles each crate too, and `simd` refuses a build without AVX2 and FMA: without the
# same CPU its docs do not build.
rustdocflags = ["-C", "target-cpu=x86-64-v3"]
