name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A new push cancels the older run of its branch or pull request: only the latest commit's result
# is read.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# No RUSTFLAGS: it would replace the x86-64-v3 flags of `.cargo/config.toml`. No
# CARGO_INCREMENTAL: rust-cache sets it to 0.

# `xorza/rust-ci` holds the steps each repository and OS shares. Its actions read bash, and a `run`
# gets `pipefail` only from a named shell.
defaults:
  run:
    shell: bash

jobs:
  gate:
    name: gate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        # The newest GA image of each: x64 Linux and Windows, arm64 macOS, so `simd` runs both
        # architectures' backends.
        os: [ubuntu-26.04, macos-26, windows-2025]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # palantir, fits-well and LibRaw. The action fetches the `git@github.com:` URLs over
          # HTTPS, as no ssh-key is given.
          submodules: true
      # libclang for LibRaw's bindgen, OpenSSL for the ONNX Runtime download of `ort-sys`.
      - uses: xorza/rust-ci/setup@5c6e2c57d2c89c894225a4fd2ac61e9129e9e32b # v1
        with:
          apt-packages: libclang-dev libssl-dev pkg-config
      # So imaginarium's GPU tests run on a runner with no GPU instead of skipping.
      - uses: xorza/rust-ci/lavapipe@5c6e2c57d2c89c894225a4fd2ac61e9129e9e32b # v1
      - uses: xorza/rust-ci/crash-capture@5c6e2c57d2c89c894225a4fd2ac61e9129e9e32b # v1
      # The gate of AGENTS.md, one step per command. Each runs past an earlier failure, so one run
      # reports every lane. palantir and fits-well are built here as dependencies alone: each
      # repository's own CI runs its lanes. `--locked` goes before the alias, as an alias's own
      # arguments end with clippy's.
      - run: cargo fmt --all --check
      - if: ${{ !cancelled() }}
        run: cargo --locked gate-lint
      - if: ${{ !cancelled() }}
        run: cargo --locked gate-lint-nogpu
      - if: ${{ !cancelled() }}
        run: cargo --locked gate-ship
      - if: ${{ !cancelled() }}
        run: cargo --locked gate-doc
      # The build apart from the run, so each shows its own time.
      - if: ${{ !cancelled() }}
        run: cargo --locked gate-test --no-run
      - uses: xorza/rust-ci/test@5c6e2c57d2c89c894225a4fd2ac61e9129e9e32b # v1
        if: ${{ !cancelled() }}
        timeout-minutes: 45
        with:
          command: cargo --locked gate-test
      - uses: xorza/rust-ci/failure-report@5c6e2c57d2c89c894225a4fd2ac61e9129e9e32b # v1
        if: failure()
        with:
          paths: test_output/**

  workflows:
    name: workflow checks
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: xorza/rust-ci/workflow-check@5c6e2c57d2c89c894225a4fd2ac61e9129e9e32b # v1
