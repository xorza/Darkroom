[workspace]
members = [
    "common",
    "scenarium",
    "darkroom",
    "lens",
    "lumos"
]
default-members = ["darkroom"]
exclude = [".tmp", "palantir", "imaginarium", "fits-well", "quickbench"]

resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
common = { path = "common" }
quickbench = { path = "quickbench" }
scenarium = { path = "scenarium" }
imaginarium = { path = "imaginarium" }
lens = { path = "lens" }
lumos = { path = "lumos" }
palantir = { path = "palantir" }
fits-well = { path = "fits-well" }

libraw-rs-sys = { version = "0.0.4" }

serde = { version = "1.0", features = ["derive", "rc"] }
uuid = { version = "1.26", features = ["v4", "v5", "serde"] }
thiserror = { version = "2.0" }
bytemuck = { version = "1.25", features = ["derive", "extern_crate_alloc"] }
glam = { version = "0.33", features = ["serde"] }
strum = { version = "0.28" }
strum_macros = { version = "0.28" }
rand = { version = "0.10" }
tokio = { version = "1.53", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
tracing = { version = "0.1" }
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
rayon = { version = "1.12" }
ron = { version = "0.12" }
notify = { version = "8" }
hashbrown = { version = "0.17", features = ["serde"] }
quote = { version = "1.0" }
proc-macro2 = { version = "1.0" }
syn = { version = "3.0", default-features = false, features = [
    "clone-impls",
    "derive",
    "parsing",
    "printing",
    "proc-macro",
] }
memmap2 = { version = "0.9" }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "tiff"] }
sysinfo = { version = "0.39" }
lz4_flex = { version = "0.14", features = ["std"] }
bitcode = { version = "0.6", features = ["serde"] }
blake3 = { version = "1.8" }
windows-sys = { version = "0.61" }
objc2 = { version = "0.6" }
objc2-app-kit = { version = "0.3", features = ["NSApplication", "NSResponder"] }
objc2-foundation = { version = "0.3", features = ["NSArray", "NSString", "NSURL"] }
rfd = { version = "0.17" }
zip = { version = "8.6", default-features = false, features = ["deflate"] }
async-trait = { version = "0.1" }
arrayvec = { version = "0.7", features = ["serde"] }
smallvec = { version = "1.16" }
static_assertions = "1.1"
parking_lot = { version = "0.12" }
rand_chacha = { version = "0.10" }
nalgebra = { version = "0.35" }
statrs = { version = "0.19", default-features = false }
clap = { version = "4.6", features = ["derive"] }
ort = { version = "2.0.0-rc.13" }

[profile.dev]
debug = "line-tables-only"

[profile.bench]
inherits = "release"
opt-level = 3
lto = "fat"
codegen-units = 1
debug = "line-tables-only"
incremental = true

[profile.release]
debug = "line-tables-only"
opt-level = 3
strip = "none"
split-debuginfo = "off"

[profile.release-max]
inherits = "release"
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
debug = false
incremental = false


[profile.dev.package."*"]
opt-level = 3

# The submodules edited and debugged most stay unoptimized, like the workspace members. A
# per-package entry takes precedence over "*".
[profile.dev.package.palantir]
opt-level = 0
[profile.dev.package.imaginarium]
opt-level = 0
[profile.dev.package.quickbench]
opt-level = 0


# Warn, not deny: the verification chain runs clippy with `-D warnings`, and a build in the
# middle of an edit keeps working. Every suppression in code is `#[expect(.., reason = "..")]`.
#
# "pending" marks a lint that is part of the set but still has hits; it moves to "warn" when its
# sweep lands (plan 2.2).
[workspace.lints.rust]
rust_2018_idioms = { level = "warn", priority = -1 }
elided_lifetimes_in_paths = "warn"
missing_debug_implementations = "warn"
redundant_imports = "warn"
trivial_numeric_casts = "warn"
unreachable_pub = "warn"
unused_lifetimes = "warn"
unused_macro_rules = "allow" # pending
unused_qualifications = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Documentation is reviewed, not linted, for these.
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
# `assert!(x.is_empty())` reads plainer than a comparison with an empty array.
assert_is_empty = "allow"
# `usize -> f32/f64` in numeric code: a hit says nothing unless the value passes 2^24, and the
# code cannot show that.
cast_precision_loss = "allow"
# `f64 -> f32` narrowing is the design of the f32 pipelines.
cast_possible_truncation = "allow"
# Math code names things `x`, `y`, `dx`, `dy`, `cx`.
similar_names = "allow"
many_single_char_names = "allow"
# Size is a review question, not a lint.
too_many_lines = "allow"
# `#[inline(always)]` on `#[target_feature]` SIMD helpers is deliberate.
inline_always = "allow"
# Exact comparison is deliberate: sample-domain scales, sentinels, tests of exact values.
float_cmp = "allow"
# Every pointer cast feeds an unaligned load (`_mm_loadu_*`).
cast_ptr_alignment = "allow"
absolute_paths = "warn"
allow_attributes = "warn"
allow_attributes_without_reason = "allow" # pending
assigning_clones = "warn"
cast_lossless = "warn"
cast_possible_wrap = "allow" # pending
cast_sign_loss = "allow" # pending
clone_on_ref_ptr = "warn"
dbg_macro = "warn"
decimal_bitwise_operands = "warn"
default_trait_access = "warn"
ignore_without_reason = "allow" # pending
items_after_statements = "allow" # pending
items_after_test_module = "warn"
large_stack_arrays = "allow" # pending
large_types_passed_by_value = "allow" # pending
let_underscore_must_use = "allow" # pending
manual_let_else = "warn"
map_err_ignore = "allow" # pending
map_unwrap_or = "warn"
match_same_arms = "allow" # pending
match_wildcard_for_single_variants = "warn"
missing_fields_in_debug = "allow" # pending
needless_pass_by_value = "allow" # pending
print_stderr = "allow" # pending
print_stdout = "allow" # pending
redundant_closure_for_method_calls = "warn"
return_self_not_must_use = "warn"
self_named_module_files = "warn"
semicolon_if_nothing_returned = "warn"
should_panic_without_expect = "allow" # pending
struct_field_names = "allow" # pending
todo = "warn"
trivially_copy_pass_by_ref = "allow" # pending
unnecessary_debug_formatting = "warn"
unnecessary_wraps = "allow" # pending
unreadable_literal = "warn"
unused_result_ok = "allow" # pending
unused_self = "allow" # pending
used_underscore_binding = "allow" # pending

[workspace.lints.rustdoc]
broken_intra_doc_links = "warn"
private_intra_doc_links = "warn"
redundant_explicit_links = "warn"
