[workspace]
members = [
    "common",
    "scenarium",
    "darkroom",
    "lens",
    "lumos",
    "imaginarium",
    "quickbench",
    "palantir",
    "fits-well"
]
default-members = ["darkroom"]
exclude = [".tmp"]

resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
common = { path = "common" }
quickbench = { path = "quickbench" }
scenarium = { path = "scenarium" }
imaginarium = { path = "imaginarium", features = ["wgpu"] }
lens = { path = "lens" }
lumos = { path = "lumos" }
palantir = { path = "palantir" }
fits-well = { path = "fits-well" }

libraw-rs-sys = { version = "0.0.4" }

serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = { version = "1.0" }
uuid = { version = "1.25", features = ["v4", "v5", "serde"] }
thiserror = { version = "2.0" }
bytemuck = { version = "1.25", features = ["derive", "extern_crate_alloc"] }
glam = { version = "0.33", features = ["serde"] }
strum = { version = "0.28" }
strum_macros = { version = "0.28" }
rand = { version = "0.10" }
tokio = { version = "1.53", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
tracing = { version = "0.1" }
# No "time" feature: 0.3.23's blanket `From<S: AsRef<str>> for EnvFilter`
# fails coherence against the time crate on rustc 1.96 (E0119); the
# built-in datetime fallback still prints RFC3339. Restore once fixed.
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
rayon = { version = "1.12" }
toml = { version = "1.1" }
notify = { version = "8" }
hashbrown = { version = "0.17", features = ["serde"] }
quote = { version = "1.0" }
proc-macro2 = { version = "1.0" }
syn = { version = "3.0", default-features = false, features = [
    "clone-impls",
    "derive",
    "parsing",
    "printing",
    "proc-macro",
] }
memmap2 = { version = "0.9" }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "tiff"] }
sysinfo = { version = "0.39" }
lz4_flex = { version = "0.14", features = ["std"] }
bitcode = { version = "0.6", features = ["serde"] }
blake3 = { version = "1.8" }
windows-sys = { version = "0.61" }
objc2 = { version = "0.6" }
objc2-app-kit = { version = "0.3", features = ["NSApplication", "NSResponder"] }
objc2-foundation = { version = "0.3", features = ["NSArray", "NSString", "NSURL"] }
dark-light = { version = "3.0" }
rfd = { version = "0.17" }
zip = { version = "8.6", default-features = false, features = ["deflate"] }
async-trait = { version = "0.1" }
arrayvec = { version = "0.7", features = ["serde"] }
smallvec = { version = "1.15" }
static_assertions = "1.1"
parking_lot = { version = "0.12" }
rand_chacha = { version = "0.10" }
nalgebra = { version = "0.35" }
statrs = { version = "0.19", default-features = false }
clap = { version = "4.6", features = ["derive"] }
ort = { version = "2.0.0-rc.13" }

[profile.dev]
debug = "line-tables-only"

[profile.bench]
inherits = "release"
opt-level = 3
lto = "fat"
codegen-units = 1
debug = "line-tables-only"
incremental = true

[profile.release]
debug = "line-tables-only"
opt-level = 3
strip = "none"
split-debuginfo = "off"

[profile.release-max]
inherits = "release"
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
debug = false
incremental = false

# Optimize heavy dependencies even in dev/test builds
[profile.dev.package.wgpu]
opt-level = 3
[profile.dev.package.wgpu-core]
opt-level = 3
[profile.dev.package.wgpu-hal]
opt-level = 3
[profile.dev.package.wgpu-types]
opt-level = 3
[profile.dev.package.naga]
opt-level = 3
[profile.dev.package.gpu-allocator]
opt-level = 3
[profile.dev.package.image]
opt-level = 3
[profile.dev.package.tiff]
opt-level = 3
[profile.dev.package.spirv]
opt-level = 3
[profile.dev.package.ash]
opt-level = 3
[profile.dev.package.png]
opt-level = 3
[profile.dev.package.zune-jpeg]
opt-level = 3
[profile.dev.package.nalgebra]
opt-level = 3
[profile.dev.package.half]
opt-level = 3
[profile.dev.package.miniz_oxide]
opt-level = 3
[profile.dev.package.flate2]
opt-level = 3
[profile.dev.package.lz4_flex]
opt-level = 3
[profile.dev.package.fits-well]
opt-level = 3
[profile.dev.package.libraw-rs-sys]
opt-level = 3
[profile.dev.package.cosmic-text]
opt-level = 3
[profile.dev.package.swash]
opt-level = 3
[profile.dev.package.fontdb]
opt-level = 3
[profile.dev.package.ttf-parser]
opt-level = 3
[profile.dev.package."owned_ttf_parser"]
opt-level = 3
[profile.dev.package.font-types]
opt-level = 3
[profile.dev.package.read-fonts]
opt-level = 3
[profile.dev.package.skrifa]
opt-level = 3


[workspace.lints.rust]
missing_debug_implementations = "deny"
unreachable_pub = "deny"

[workspace.lints.clippy]
items_after_test_module = "deny"

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"
private_intra_doc_links = "deny"
redundant_explicit_links = "deny"
