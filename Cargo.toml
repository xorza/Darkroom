[package]
name = "imaginarium"
version = "0.1.0"
edition = "2024"
exclude = ["AGENTS.md", "CLAUDE.md"]

[lints.rust]
rust_2018_idioms = { level = "warn", priority = -1 }
missing_debug_implementations = "warn"
redundant_imports = "warn"
trivial_numeric_casts = "warn"
unreachable_pub = "warn"
unused_lifetimes = "warn"
unused_macro_rules = "warn"
unused_qualifications = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Documentation is reviewed, not linted, for these.
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
# `assert!(x.is_empty())` reads plainer than a comparison with an empty array.
assert_is_empty = "allow"
# `usize -> f32/f64` in numeric code: a hit says nothing unless the value passes 2^24.
cast_precision_loss = "allow"
# `f64 -> f32` narrowing is the design of the f32 pipelines.
cast_possible_truncation = "allow"
# Math code names things `x`, `y`, `dx`, `dy`, `cx`.
similar_names = "allow"
many_single_char_names = "allow"
# Size is a review question, not a lint.
too_many_lines = "allow"
# `#[inline(always)]` on `#[target_feature]` SIMD helpers is deliberate.
inline_always = "allow"
# Exact comparison is deliberate where it appears.
float_cmp = "allow"
# Every pointer cast feeds an unaligned load.
cast_ptr_alignment = "allow"
absolute_paths = "warn"
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
clone_on_ref_ptr = "warn"
dbg_macro = "warn"
items_after_test_module = "warn"
let_underscore_must_use = "warn"
print_stderr = "warn"
print_stdout = "warn"
self_named_module_files = "warn"
todo = "warn"
unused_result_ok = "warn"

[lints.rustdoc]
broken_intra_doc_links = "warn"
private_intra_doc_links = "warn"
redundant_explicit_links = "warn"

[features]
default = []
wgpu = ["dep:wgpu", "dep:pollster", "dep:tokio"]
internals = []
# Compiles the colocated `bench.rs` drivers and the `bench` facade they are
# reached through. Not part of the supported surface.
bench = ["internals", "dep:criterion"]

[dependencies]
wgpu = { version = "30.0", features = ["metal", "vulkan", "dx12"], optional = true }
thiserror = { version = "2.0" }
bytemuck = { version = "1.25", features = ["derive", "extern_crate_std", "min_const_generics"] }
pollster = { version = "1.0", optional = true }
glam = { version = "0.33" }
strum = { version = "0.28" }
strum_macros = { version = "0.28" }
tokio = { version = "1.53", features = ["sync"], optional = true }
rayon = { version = "1.12" }
tiff = { version = "0.11" }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "tiff"] }
criterion = { version = "0.8", optional = true }


[[example]]
name = "transform"
required-features = ["wgpu"]

[[example]]
name = "pipeline"
required-features = ["wgpu"]

[[bench]]
name = "contrast_brightness"
harness = false
required-features = ["bench"]

[[bench]]
name = "transform"
harness = false
required-features = ["bench"]

[[bench]]
name = "preview"
harness = false
required-features = ["bench"]

[[bench]]
name = "conversion"
harness = false
required-features = ["bench"]

[package.metadata.cargo-machete]
ignored = ["strum"]

[profile.bench]
debug = true
opt-level = 3
strip = "none"
split-debuginfo = "off"

[profile.release]
debug = true
strip = "none"
opt-level = 3
split-debuginfo = "off"

# Dependencies optimized in dev and test builds; this crate itself stays unoptimized.
[profile.dev.package."*"]
opt-level = 3

[dev-dependencies]
tempfile = "3"
