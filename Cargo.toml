[workspace]
members = [
    "common",
    "scenarium",
    "darkroom",
    "lens",
    "lumos"
]
default-members = ["darkroom"]
exclude = [".tmp", "palantir", "imaginarium", "fits-well", "quickbench"]

resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
common = { path = "common" }
quickbench = { path = "quickbench" }
scenarium = { path = "scenarium" }
imaginarium = { path = "imaginarium", features = ["wgpu"] }
lens = { path = "lens" }
lumos = { path = "lumos" }
palantir = { path = "palantir" }
fits-well = { path = "fits-well" }

libraw-rs-sys = { version = "0.0.4" }

serde = { version = "1.0", features = ["derive", "rc"] }
uuid = { version = "1.26", features = ["v4", "v5", "serde"] }
thiserror = { version = "2.0" }
bytemuck = { version = "1.25", features = ["derive", "extern_crate_alloc"] }
glam = { version = "0.33", features = ["serde"] }
strum = { version = "0.28" }
strum_macros = { version = "0.28" }
rand = { version = "0.10" }
tokio = { version = "1.53", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
tracing = { version = "0.1" }
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
rayon = { version = "1.12" }
ron = { version = "0.12" }
notify = { version = "8" }
hashbrown = { version = "0.17", features = ["serde"] }
quote = { version = "1.0" }
proc-macro2 = { version = "1.0" }
syn = { version = "3.0", default-features = false, features = [
    "clone-impls",
    "derive",
    "parsing",
    "printing",
    "proc-macro",
] }
memmap2 = { version = "0.9" }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "tiff"] }
sysinfo = { version = "0.39" }
lz4_flex = { version = "0.14", features = ["std"] }
bitcode = { version = "0.6", features = ["serde"] }
blake3 = { version = "1.8" }
windows-sys = { version = "0.61" }
objc2 = { version = "0.6" }
objc2-app-kit = { version = "0.3", features = ["NSApplication", "NSResponder"] }
objc2-foundation = { version = "0.3", features = ["NSArray", "NSString", "NSURL"] }
rfd = { version = "0.17" }
zip = { version = "8.6", default-features = false, features = ["deflate"] }
async-trait = { version = "0.1" }
arrayvec = { version = "0.7", features = ["serde"] }
smallvec = { version = "1.16" }
static_assertions = "1.1"
parking_lot = { version = "0.12" }
rand_chacha = { version = "0.10" }
nalgebra = { version = "0.35" }
statrs = { version = "0.19", default-features = false }
clap = { version = "4.6", features = ["derive"] }
ort = { version = "2.0.0-rc.13" }

[profile.dev]
debug = "line-tables-only"

[profile.bench]
inherits = "release"
opt-level = 3
lto = "fat"
codegen-units = 1
debug = "line-tables-only"
incremental = true

[profile.release]
debug = "line-tables-only"
opt-level = 3
strip = "none"
split-debuginfo = "off"

[profile.release-max]
inherits = "release"
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
debug = false
incremental = false


[profile.dev.package."*"]
opt-level = 3

# The submodules edited and debugged most stay unoptimized, like the workspace members. A
# per-package entry takes precedence over "*".
[profile.dev.package.palantir]
opt-level = 0
[profile.dev.package.imaginarium]
opt-level = 0
[profile.dev.package.quickbench]
opt-level = 0


[workspace.lints.rust]
missing_debug_implementations = "deny"
unreachable_pub = "deny"

[workspace.lints.clippy]
clone_on_ref_ptr = "deny"
items_after_test_module = "deny"

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"
private_intra_doc_links = "deny"
redundant_explicit_links = "deny"
