[package]
name = "imaginarium"
version = "0.1.0"
edition = "2024"
exclude = ["AGENTS.md", "CLAUDE.md"]

[lints.rust]
missing_debug_implementations = "deny"
unreachable_pub = "deny"

[lints.clippy]
items_after_test_module = "deny"

[lints.rustdoc]
broken_intra_doc_links = "deny"

[features]
default = []
wgpu = ["dep:wgpu", "dep:pollster", "dep:tokio"]
internals = []
# Compiles the colocated `bench.rs` drivers and the `bench` facade they are
# reached through. Not part of the supported surface.
bench = ["internals", "dep:criterion"]

[dependencies]
wgpu = { version = "30.0", features = ["metal", "vulkan", "dx12"], optional = true }
thiserror = { version = "2.0" }
bytemuck = { version = "1.25", features = ["derive", "extern_crate_alloc"] }
pollster = { version = "1.0", optional = true }
glam = { version = "0.33", features = ["serde"] }
strum = { version = "0.28" }
strum_macros = { version = "0.28" }
tokio = { version = "1.53", features = ["sync", "rt", "macros"], optional = true }
tracing = { version = "0.1" }
rayon = { version = "1.12" }
hashbrown = { version = "0.17", features = ["serde"] }
tiff = { version = "0.11" }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "tiff"] }
paste = { version = "1.0" }
parking_lot = { version = "0.12", features = ["send_guard"] }
arc-swap = { version = "1.9" }
serde = { version = "1.0", features = ["derive"] }
criterion = { version = "0.8", optional = true }


[[example]]
name = "transform"
# Drives GpuImage/Gpu directly, whose constructors are `internals`-gated.
required-features = ["wgpu", "internals"]

[[example]]
name = "pipeline"
required-features = ["wgpu"]

[[example]]
name = "pipeline_explicit"
required-features = ["wgpu"]

[[bench]]
name = "contrast_brightness"
harness = false
required-features = ["bench"]

[[bench]]
name = "transform"
harness = false
required-features = ["bench"]

[[bench]]
name = "preview"
harness = false
required-features = ["bench"]

[[bench]]
name = "conversion"
harness = false
required-features = ["bench"]

[package.metadata.cargo-machete]
ignored = ["strum"]

[profile.bench]
debug = true
opt-level = 3
strip = "none"
split-debuginfo = "off"

[profile.release]
debug = true
strip = "none"
opt-level = 3
split-debuginfo = "off"

# Optimize heavy dependencies even in dev/test builds
[profile.dev.package.wgpu]
opt-level = 3
[profile.dev.package.wgpu-core]
opt-level = 3
[profile.dev.package.wgpu-hal]
opt-level = 3
[profile.dev.package.wgpu-types]
opt-level = 3
[profile.dev.package.naga]
opt-level = 3
[profile.dev.package.gpu-allocator]
opt-level = 3
[profile.dev.package.image]
opt-level = 3
[profile.dev.package.tiff]
opt-level = 3
[profile.dev.package.spirv]
opt-level = 3
[profile.dev.package.ash]
opt-level = 3
[profile.dev.package.png]
opt-level = 3
[profile.dev.package.zune-jpeg]
opt-level = 3
