[workspace]
members = [
    "common",
    "common/common-derive",
    "scenarium",
    "imaginarium",
    "lumos",
    "libraw-sys",
    "libraw",
    "lens",
    "darkroom",
]
default-members = ["darkroom"]
exclude = ["palantir", "fits-well"]

resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"

# The driver's lanes. The tests leave out the data bundle a fresh clone lacks,
# and Tracy, which makes each test wait on its profiler. `cargo test` ran the suite in 2.2 s where
# nextest took 3.5 s.
[workspace.metadata.drive]
version = "0.2.1"
test = [{ all-features-but = ["lumos/real-data", "darkroom/profile-with-tracy"] }]
test-runner = "cargo-test"
# The second lint set is the CPU-only build of imaginarium. The benches always measure its GPU
# build.
lint = ["--all-features", { all-features-but = ["imaginarium/wgpu"] }]
bench = "--features imaginarium/wgpu"

# A host never compiles imaginarium's SIMD kernels of the other architecture, so a change to one
# runs the lint for it: `lint-x86` from an arm64 host, `lint-aarch64` from an x86 one, each after
# `rustup target add` of its target. Not `cross-lint`, which lints every member: `libraw-sys`
# builds LibRaw's C++ for the target. The target's own rustflags join the root's `target-cpu`,
# where `RUSTFLAGS` would replace it.
[workspace.metadata.drive.commands.lint-x86]
steps = [{ build = "clippy -p imaginarium --all-targets --all-features --target x86_64-unknown-linux-gnu", env = { CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS = "-D warnings" } }]

[workspace.metadata.drive.commands.lint-aarch64]
steps = [{ build = "clippy -p imaginarium --all-targets --all-features --target aarch64-unknown-linux-gnu", env = { CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_RUSTFLAGS = "-D warnings" } }]

# The tests that read the gitignored dataset in `test_data/lumos_data/`, only when asked; the
# arguments go to the test binaries, as a name filter.
[workspace.metadata.drive.commands.real-data]
steps = [{ cargo = "test -p lumos --all-features", args = true }]

# A change to a lumos vector kernel, on an x86_64 host: no vector op fell out of line.
[workspace.metadata.drive.commands.inline-kernels]
steps = [{ program = ["lumos/scripts/inline-kernels.sh", "{target}"] }]

[workspace.dependencies]
common = { path = "common" }
common-derive = { path = "common/common-derive" }
scenarium = { path = "scenarium" }
lumos = { path = "lumos" }
lens = { path = "lens" }
darkroom = { path = "darkroom" }
palantir = { path = "palantir" }
imaginarium = { path = "imaginarium" }
fits-well = { path = "fits-well" }
libraw-sys = { path = "libraw-sys" }
libraw = { path = "libraw" }

serde = { version = "1.0", default-features = false }
uuid = { version = "1.29", default-features = false }
thiserror = { version = "2.0", default-features = false }
bytemuck = { version = "1.25", default-features = false }
glam = { version = "0.34", default-features = false }
strum = { version = "0.28", default-features = false }
rand = { version = "0.10", default-features = false }
tokio = { version = "1.54", default-features = false }
tokio-util = { version = "0.7", default-features = false }
tracing = { version = "0.1", default-features = false }
tracing-subscriber = { version = "0.3", default-features = false }
rayon = { version = "1.12", default-features = false }
ron = { version = "0.12", default-features = false }
notify = { version = "8", default-features = false }
hashbrown = { version = "0.17", default-features = false }
quote = { version = "1.0", default-features = false }
proc-macro2 = { version = "1.0", default-features = false }
syn = { version = "3.0", default-features = false }
memmap2 = { version = "0.9", default-features = false }
image = { version = "0.25", default-features = false }
sysinfo = { version = "0.39", default-features = false }
bitcode = { version = "0.6", default-features = false }
blake3 = { version = "1.8", default-features = false }
windows = { version = "0.62", default-features = false }
libc = { version = "0.2", default-features = false }
objc2 = { version = "0.6", default-features = false }
objc2-app-kit = { version = "0.3", default-features = false }
objc2-foundation = { version = "0.3", default-features = false }
rfd = { version = "0.17", default-features = false }
zip = { version = "9.1", default-features = false }
async-trait = { version = "0.1", default-features = false }
arrayvec = { version = "0.7", default-features = false }
static_assertions = { version = "1.1", default-features = false }
rand_chacha = { version = "0.10", default-features = false }
nalgebra = { version = "0.35", default-features = false }
criterion = { version = "0.8", default-features = false }
statrs = { version = "0.19", default-features = false }
clap = { version = "4.6", default-features = false }
winresource = { version = "0.1", default-features = false }
ort = { version = "2.0.0-rc.15", default-features = false }
cc = { version = "1.10", default-features = false }
libz-sys = { version = "1.1", default-features = false }
bindgen = { version = "0.73", default-features = false }
wgpu = { version = "30.0", default-features = false }
pollster = { version = "1.0", default-features = false }
tiff = { version = "0.11", default-features = false }

[profile.dev]
opt-level = 1
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 3
debug = false

[profile.dev.package.palantir]
opt-level = 1
debug = "line-tables-only"
[profile.dev.package.fits-well]
opt-level = 1
debug = "line-tables-only"

[profile.dev.package.libraw-sys]
opt-level = 3

# `objc2` debug assertions allocate on every Metal message send.
[profile.dev.package.objc2]
debug-assertions = false

# Full debug info, which `darkroom/packaging` splits out of the shipped binary.
[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
debug = "full"
split-debuginfo = "off"

[profile.bench]
debug = "line-tables-only"
strip = "none"

[profile.release-dev]
inherits = "release"
lto = "thin"
codegen-units = 16
incremental = true
debug = "line-tables-only"

# Warn, not deny: the verification chain runs clippy with `-D warnings`.
[workspace.lints.rust]
rust_2018_idioms = { level = "warn", priority = -1 }
meta_variable_misuse = "warn"
missing_debug_implementations = "warn"
non_ascii_idents = "warn"
redundant_imports = "warn"
redundant_lifetimes = "warn"
trivial_casts = "warn"
trivial_numeric_casts = "warn"
unit_bindings = "warn"
unnameable_types = "warn"
unreachable_pub = "warn"
unused_import_braces = "warn"
unused_lifetimes = "warn"
unused_macro_rules = "warn"
unused_qualifications = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
assert_is_empty = "allow"
cast_precision_loss = "allow"
cast_possible_truncation = "allow"
similar_names = "allow"
many_single_char_names = "allow"
too_many_lines = "allow"
inline_always = "allow"
float_cmp = "allow"
cast_possible_wrap = "allow"
doc_markdown = "allow"
unreadable_literal = "allow"
struct_excessive_bools = "allow"
wildcard_imports = "allow"
unchecked_time_subtraction = "allow"
struct_field_names = "allow"
match_same_arms = "allow"
unused_self = "allow"
absolute_paths = "warn"
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
as_underscore = "warn"
branches_sharing_code = "warn"
clear_with_drain = "warn"
clone_on_ref_ptr = "warn"
collection_is_never_read = "warn"
dbg_macro = "warn"
debug_assert_with_mut_call = "warn"
deref_by_slicing = "warn"
derive_partial_eq_without_eq = "warn"
empty_enum_variants_with_brackets = "warn"
empty_structs_with_brackets = "warn"
equatable_if_let = "warn"
exit = "warn"
filetype_is_file = "warn"
fn_to_numeric_cast_any = "warn"
get_unwrap = "warn"
if_then_some_else_none = "warn"
imprecise_flops = "warn"
infinite_loop = "warn"
iter_over_hash_type = "warn"
iter_with_drain = "warn"
large_include_file = "warn"
literal_string_with_formatting_args = "warn"
lossy_float_literal = "warn"
mem_forget = "warn"
missing_const_for_fn = "warn"
mixed_read_write_in_expression = "warn"
module_name_repetitions = "warn"
mutex_atomic = "warn"
needless_collect = "warn"
needless_pass_by_ref_mut = "warn"
needless_raw_strings = "warn"
negative_feature_names = "warn"
non_zero_suggestions = "warn"
or_fun_call = "warn"
pathbuf_init_then_push = "warn"
precedence_bits = "warn"
print_stderr = "warn"
print_stdout = "warn"
rc_buffer = "warn"
rc_mutex = "warn"
redundant_clone = "warn"
redundant_feature_names = "warn"
redundant_type_annotations = "warn"
rest_pat_in_fully_bound_structs = "warn"
return_and_then = "warn"
self_named_module_files = "warn"
string_lit_chars_any = "warn"
todo = "warn"
trait_duplication_in_bounds = "warn"
try_err = "warn"
type_repetition_in_bounds = "warn"
unimplemented = "warn"
unnecessary_safety_comment = "warn"
unnecessary_safety_doc = "warn"
unnecessary_self_imports = "warn"
use_self = "warn"
useless_let_if_seq = "warn"
verbose_file_reads = "warn"
wildcard_dependencies = "warn"

[workspace.lints.rustdoc]
broken_intra_doc_links = "warn"
private_intra_doc_links = "warn"
redundant_explicit_links = "warn"
unescaped_backticks = "warn"
