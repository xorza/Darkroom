[workspace]
members = [
    "common",
    "common/common-derive",
    "scenarium",
    "lumos",
    "libraw-sys",
    "lens",
    "darkroom",
]
default-members = ["darkroom"]
exclude = ["palantir", "imaginarium", "fits-well"]

resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
common = { path = "common" }
common-derive = { path = "common/common-derive" }
scenarium = { path = "scenarium" }
lumos = { path = "lumos" }
lens = { path = "lens" }
palantir = { path = "palantir" }
imaginarium = { path = "imaginarium" }
fits-well = { path = "fits-well" }
libraw-sys = { path = "libraw-sys" }

serde = { version = "1.0", features = ["derive", "rc"] }
uuid = { version = "1.28", features = ["v4", "v5", "serde"] }
thiserror = { version = "2.0" }
bytemuck = { version = "1.25", features = ["derive", "extern_crate_alloc"] }
glam = { version = "0.34", features = ["serde"] }
strum = { version = "0.28" }
strum_macros = { version = "0.28" }
rand = { version = "0.10" }
tokio = { version = "1.53", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
tracing = { version = "0.1" }
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
rayon = { version = "1.12" }
ron = { version = "0.12" }
notify = { version = "8" }
hashbrown = { version = "0.17", features = ["serde"] }
quote = { version = "1.0" }
proc-macro2 = { version = "1.0" }
syn = { version = "3.0", default-features = false, features = [
    "clone-impls",
    "derive",
    "parsing",
    "printing",
    "proc-macro",
] }
memmap2 = { version = "0.9" }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "tiff"] }
sysinfo = { version = "0.39" }
bitcode = { version = "0.6", features = ["serde"] }
blake3 = { version = "1.8" }
windows-sys = { version = "0.61" }
windows = { version = "0.62" }
libc = { version = "0.2" }
objc2 = { version = "0.6" }
objc2-app-kit = { version = "0.3", features = ["NSApplication", "NSResponder"] }
objc2-foundation = { version = "0.3", features = ["NSArray", "NSString", "NSURL"] }
rfd = { version = "0.17" }
zip = { version = "9.0", default-features = false, features = ["deflate"] }
async-trait = { version = "0.1" }
arrayvec = { version = "0.7", features = ["serde"] }
static_assertions = "1.1"
rand_chacha = { version = "0.10" }
nalgebra = { version = "0.35" }
criterion = { version = "0.8" }
statrs = { version = "0.19", default-features = false }
clap = { version = "4.6", features = ["derive"] }
winresource = { version = "0.1" }
ort = { version = "2.0.0-rc.13" }
cc = { version = "1.8" }
libz-sys = { version = "1.1", default-features = false, features = ["static"] }
bindgen = { version = "0.73", default-features = false }

# The same profiles in every workspace root here: Cargo reads them from the root alone.
[profile.dev]
opt-level = 1
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 3

# Path dependencies, which "*" would build at 3.
[profile.dev.package.palantir]
opt-level = 1
[profile.dev.package.imaginarium]
opt-level = 1
[profile.dev.package.fits-well]
opt-level = 1

# Its build script compiles LibRaw at the profile's opt-level.
[profile.dev.package.libraw-sys]
opt-level = 3

# `objc2` debug assertions allocate on every Metal message send.
[profile.dev.package.objc2]
debug-assertions = false

# Full debug info, which `darkroom/packaging` splits out of the shipped binary.
[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
debug = "full"
split-debuginfo = "off"

[profile.bench]
debug = "line-tables-only"
strip = "none"

[profile.release-dev]
inherits = "release"
lto = "thin"
codegen-units = 16
incremental = true
debug = "line-tables-only"

# Warn, not deny: the verification chain runs clippy with `-D warnings`.
[workspace.lints.rust]
rust_2018_idioms = { level = "warn", priority = -1 }
meta_variable_misuse = "warn"
missing_debug_implementations = "warn"
non_ascii_idents = "warn"
redundant_imports = "warn"
redundant_lifetimes = "warn"
trivial_casts = "warn"
trivial_numeric_casts = "warn"
unit_bindings = "warn"
unnameable_types = "warn"
unreachable_pub = "warn"
unused_import_braces = "warn"
unused_lifetimes = "warn"
unused_macro_rules = "warn"
unused_qualifications = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
assert_is_empty = "allow"
cast_precision_loss = "allow"
cast_possible_truncation = "allow"
similar_names = "allow"
many_single_char_names = "allow"
too_many_lines = "allow"
inline_always = "allow"
float_cmp = "allow"
cast_possible_wrap = "allow"
doc_markdown = "allow"
unreadable_literal = "allow"
struct_excessive_bools = "allow"
wildcard_imports = "allow"
unchecked_time_subtraction = "allow"
struct_field_names = "allow"
match_same_arms = "allow"
unused_self = "allow"
absolute_paths = "warn"
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
as_underscore = "warn"
branches_sharing_code = "warn"
clear_with_drain = "warn"
clone_on_ref_ptr = "warn"
collection_is_never_read = "warn"
dbg_macro = "warn"
debug_assert_with_mut_call = "warn"
deref_by_slicing = "warn"
derive_partial_eq_without_eq = "warn"
empty_enum_variants_with_brackets = "warn"
empty_structs_with_brackets = "warn"
equatable_if_let = "warn"
exit = "warn"
filetype_is_file = "warn"
fn_to_numeric_cast_any = "warn"
get_unwrap = "warn"
if_then_some_else_none = "warn"
imprecise_flops = "warn"
infinite_loop = "warn"
iter_over_hash_type = "warn"
iter_with_drain = "warn"
large_include_file = "warn"
literal_string_with_formatting_args = "warn"
lossy_float_literal = "warn"
mem_forget = "warn"
missing_const_for_fn = "warn"
mixed_read_write_in_expression = "warn"
module_name_repetitions = "warn"
mutex_atomic = "warn"
needless_collect = "warn"
needless_pass_by_ref_mut = "warn"
needless_raw_strings = "warn"
negative_feature_names = "warn"
non_zero_suggestions = "warn"
or_fun_call = "warn"
pathbuf_init_then_push = "warn"
precedence_bits = "warn"
print_stderr = "warn"
print_stdout = "warn"
rc_buffer = "warn"
rc_mutex = "warn"
redundant_clone = "warn"
redundant_feature_names = "warn"
redundant_type_annotations = "warn"
rest_pat_in_fully_bound_structs = "warn"
return_and_then = "warn"
self_named_module_files = "warn"
string_lit_chars_any = "warn"
todo = "warn"
trait_duplication_in_bounds = "warn"
try_err = "warn"
type_repetition_in_bounds = "warn"
unimplemented = "warn"
unnecessary_safety_comment = "warn"
unnecessary_safety_doc = "warn"
unnecessary_self_imports = "warn"
use_self = "warn"
useless_let_if_seq = "warn"
verbose_file_reads = "warn"
wildcard_dependencies = "warn"

[workspace.lints.rustdoc]
broken_intra_doc_links = "warn"
private_intra_doc_links = "warn"
redundant_explicit_links = "warn"
unescaped_backticks = "warn"
