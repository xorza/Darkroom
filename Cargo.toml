[package]
name = "imaginarium"
version = "0.1.0"
edition = "2024"
exclude = ["AGENTS.md", "CLAUDE.md"]

# One lint set for every crate of the Darkroom workspace, copied here because a submodule does
# not inherit it. Warn, not deny: the verification chain runs clippy with `-D warnings`, and a
# build in the middle of an edit keeps working. Every suppression in code is
# `#[expect(.., reason = "..")]`.
[lints.rust]
rust_2018_idioms = { level = "warn", priority = -1 }
elided_lifetimes_in_paths = "warn"
missing_debug_implementations = "warn"
redundant_imports = "warn"
trivial_numeric_casts = "warn"
unreachable_pub = "warn"
unused_lifetimes = "warn"
unused_macro_rules = "warn"
unused_qualifications = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Documentation is reviewed, not linted, for these.
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
# `assert!(x.is_empty())` reads plainer than a comparison with an empty array.
assert_is_empty = "allow"
# `usize -> f32/f64` in numeric code: a hit says nothing unless the value passes 2^24, and the
# code cannot show that.
cast_precision_loss = "allow"
# `f64 -> f32` narrowing is the design of the f32 pipelines.
cast_possible_truncation = "allow"
# Math code names things `x`, `y`, `dx`, `dy`, `cx`.
similar_names = "allow"
many_single_char_names = "allow"
# Size is a review question, not a lint.
too_many_lines = "allow"
# `#[inline(always)]` on `#[target_feature]` SIMD helpers is deliberate.
inline_always = "allow"
# Exact comparison is deliberate: sample-domain scales, sentinels, tests of exact values.
float_cmp = "allow"
# Every pointer cast feeds an unaligned load (`_mm_loadu_*`).
cast_ptr_alignment = "allow"
# `u32 -> i32` wraps only above 2^31, and `cast_possible_truncation`, allowed above, already
# admits the wider `usize -> i32`.
cast_possible_wrap = "allow"
# Backticks in docs are reviewed, not linted: every proper noun was one more exception to list.
doc_markdown = "allow"
absolute_paths = "warn"
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
assigning_clones = "warn"
cast_lossless = "warn"
cast_sign_loss = "warn"
clone_on_ref_ptr = "warn"
dbg_macro = "warn"
decimal_bitwise_operands = "warn"
default_trait_access = "warn"
ignore_without_reason = "warn"
items_after_statements = "warn"
items_after_test_module = "warn"
large_stack_arrays = "warn"
large_types_passed_by_value = "warn"
manual_let_else = "warn"
map_unwrap_or = "warn"
match_same_arms = "warn"
match_wildcard_for_single_variants = "warn"
# `const fn` by default: every fn that can be one is.
missing_const_for_fn = "warn"
missing_fields_in_debug = "warn"
needless_pass_by_value = "warn"
print_stderr = "warn"
print_stdout = "warn"
redundant_closure_for_method_calls = "warn"
return_self_not_must_use = "warn"
self_named_module_files = "warn"
semicolon_if_nothing_returned = "warn"
should_panic_without_expect = "warn"
struct_field_names = "warn"
todo = "warn"
trivially_copy_pass_by_ref = "warn"
unnecessary_debug_formatting = "warn"
unnecessary_wraps = "warn"
unreadable_literal = "warn"
unused_self = "warn"
used_underscore_binding = "warn"

[lints.rustdoc]
broken_intra_doc_links = "warn"
private_intra_doc_links = "warn"
redundant_explicit_links = "warn"

[features]
default = []
wgpu = ["dep:wgpu", "dep:pollster", "dep:tokio"]
internals = []
# Compiles the colocated `bench.rs` drivers and the `bench` facade they are
# reached through. Not part of the supported surface.
bench = ["internals", "dep:criterion"]

[dependencies]
wgpu = { version = "30.0", features = ["metal", "vulkan", "dx12"], optional = true }
thiserror = { version = "2.0" }
bytemuck = { version = "1.25", features = ["derive", "extern_crate_std", "min_const_generics"] }
pollster = { version = "1.0", optional = true }
glam = { version = "0.33" }
strum = { version = "0.28" }
strum_macros = { version = "0.28" }
tokio = { version = "1.53", features = ["sync"], optional = true }
rayon = { version = "1.12" }
tiff = { version = "0.11" }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "tiff"] }
criterion = { version = "0.8", optional = true }


[[example]]
name = "transform"
required-features = ["wgpu"]

[[example]]
name = "pipeline"
required-features = ["wgpu"]

[[bench]]
name = "contrast_brightness"
harness = false
required-features = ["bench"]

[[bench]]
name = "transform"
harness = false
required-features = ["bench"]

[[bench]]
name = "preview"
harness = false
required-features = ["bench"]

[[bench]]
name = "conversion"
harness = false
required-features = ["bench"]

[package.metadata.cargo-machete]
ignored = ["strum"]

[profile.bench]
debug = "line-tables-only"
opt-level = 3
strip = "none"
split-debuginfo = "off"

[profile.release]
debug = "line-tables-only"
strip = "none"
opt-level = 3
split-debuginfo = "off"

# Dependencies optimized in dev and test builds; this crate itself stays unoptimized.
[profile.dev.package."*"]
opt-level = 3

[dev-dependencies]
tempfile = "3"
