[package]
name = "imaginarium"
version = "0.1.0"
edition = "2024"
exclude = ["AGENTS.md", "CLAUDE.md"]

# The Darkroom workspace's lint set, copied as a submodule does not inherit it. Warn, not deny:
# the verification chain runs clippy with `-D warnings`.
[lints.rust]
rust_2018_idioms = { level = "warn", priority = -1 }
elided_lifetimes_in_paths = "warn"
missing_debug_implementations = "warn"
redundant_imports = "warn"
trivial_numeric_casts = "warn"
unreachable_pub = "warn"
unused_lifetimes = "warn"
unused_macro_rules = "warn"
unused_qualifications = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
assert_is_empty = "allow"
# A hit says nothing unless a `usize` passes 2^24, which the code cannot show.
cast_precision_loss = "allow"
cast_possible_truncation = "allow"
similar_names = "allow"
many_single_char_names = "allow"
too_many_lines = "allow"
inline_always = "allow"
float_cmp = "allow"
# Every pointer cast feeds an unaligned load (`_mm_loadu_*`).
cast_ptr_alignment = "allow"
# `cast_possible_truncation`, allowed, already admits the wider `usize -> i32`.
cast_possible_wrap = "allow"
doc_markdown = "allow"
unreadable_literal = "allow"
struct_excessive_bools = "allow"
wildcard_imports = "allow"
# The subtraction already panics on underflow, as `checked_sub(..).unwrap()` would.
unchecked_time_subtraction = "allow"
# A shared suffix is usually a unit (`_ns`), and `Window::window` is often the plainest name.
struct_field_names = "allow"
# Equal arms stay apart for a guard, a fallback, or bindings no `|` pattern can join.
match_same_arms = "allow"
unused_self = "allow"
absolute_paths = "warn"
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
assigning_clones = "warn"
cast_lossless = "warn"
cast_sign_loss = "warn"
clone_on_ref_ptr = "warn"
dbg_macro = "warn"
decimal_bitwise_operands = "warn"
default_trait_access = "warn"
ignore_without_reason = "warn"
imprecise_flops = "warn"
items_after_statements = "warn"
items_after_test_module = "warn"
large_stack_arrays = "warn"
large_types_passed_by_value = "warn"
lossy_float_literal = "warn"
manual_let_else = "warn"
map_unwrap_or = "warn"
match_wildcard_for_single_variants = "warn"
missing_const_for_fn = "warn"
missing_fields_in_debug = "warn"
needless_pass_by_value = "warn"
print_stderr = "warn"
print_stdout = "warn"
redundant_closure_for_method_calls = "warn"
return_self_not_must_use = "warn"
self_named_module_files = "warn"
semicolon_if_nothing_returned = "warn"
should_panic_without_expect = "warn"
todo = "warn"
trivially_copy_pass_by_ref = "warn"
unnecessary_debug_formatting = "warn"
unnecessary_wraps = "warn"
used_underscore_binding = "warn"

[lints.rustdoc]
broken_intra_doc_links = "warn"
private_intra_doc_links = "warn"
redundant_explicit_links = "warn"
unescaped_backticks = "warn"

[features]
default = []
wgpu = ["dep:wgpu", "dep:pollster", "dep:tokio"]
internals = ["dep:criterion"]

[dependencies]
wgpu = { version = "30.0", features = ["metal", "vulkan", "dx12"], optional = true }
thiserror = { version = "2.0" }
bytemuck = { version = "1.25", features = ["derive", "extern_crate_std", "min_const_generics"] }
pollster = { version = "1.0", optional = true }
glam = { version = "0.34" }
strum = { version = "0.28" }
strum_macros = { version = "0.28" }
tokio = { version = "1.53", features = ["sync"], optional = true }
rayon = { version = "1.12" }
tiff = { version = "0.11" }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "tiff"] }
criterion = { version = "0.8", optional = true }


[[example]]
name = "transform"
required-features = ["wgpu"]

[[example]]
name = "pipeline"
required-features = ["wgpu"]

[lib]
bench = false

[[bench]]
name = "imaginarium"
harness = false
required-features = ["internals"]

[package.metadata.cargo-machete]
ignored = ["strum"]

# The same profiles in every workspace root here: Cargo reads them from the root alone.
[profile.dev]
opt-level = 1
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 3

# `objc2` debug assertions allocate on every Metal message send.
[profile.dev.package.objc2]
debug-assertions = false

# Full debug info, which `darkroom/packaging` splits out of the shipped binary.
[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
debug = "full"
split-debuginfo = "off"

[profile.bench]
debug = "line-tables-only"
strip = "none"

[profile.release-dev]
inherits = "release"
lto = "thin"
codegen-units = 16
incremental = true
debug = "line-tables-only"

[dev-dependencies]
imaginarium = { path = ".", default-features = false, features = ["internals"] }
tempfile = "3"
