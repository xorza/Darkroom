    { path = "std::fs::exists", reason = "go through `common::fs`, the one route to the file system" },
    { path = "std::fs::soft_link", reason = "go through `common::fs`, the one route to the file system" },
    { path = "std::fs::File::open", reason = "go through `common::fs`, the one route to the file system" },
