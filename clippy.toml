allow-print-in-tests = true
allowed-wildcard-imports = ["x86_64", "aarch64", "arch"]
absolute-paths-allowed-crates = ["std", "core", "alloc"]
disallowed-types = [
    { path = "std::thread::LocalKey", reason = "state lives on an owner and travels by parameter" },
    # I/O and thread creation go through `common`, which has its own `clippy.toml` without these.
    { path = "std::fs::OpenOptions", reason = "open through `common::fs`, the one route to the file system" },
    { path = "std::thread::Builder", reason = "spawn a named thread through `common::thread`" },
    { path = "rayon::ThreadPoolBuilder", reason = "parallel work runs on rayon's global pool, through `common::par`" },
    { path = "std::process::Command", reason = "start a process through `common::process`" },
    { path = "tokio::fs::OpenOptions", reason = "open through `common::fs`, the one route to the file system" },
    { path = "std::fs::DirBuilder", reason = "go through `common::fs`, the one route to the file system" },
    { path = "tokio::fs::DirBuilder", reason = "go through `common::fs`, the one route to the file system" },
    { path = "memmap2::MmapOptions", reason = "map through `common::MappedFile`" },
    { path = "memmap2::MmapRaw", reason = "map through `common::MappedFile`" },
    { path = "sysinfo::System", reason = "read the system through `common`'s `SystemMemory` and `ResidentMemory`" },
    { path = "sysinfo::Disks", reason = "read the system through `common::FileSystem`" },
]

