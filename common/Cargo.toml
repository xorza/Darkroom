[package]
name = "common"
version.workspace = true
edition.workspace = true
exclude = ["AGENTS.md", "CLAUDE.md"]

[lints]
workspace = true

[features]
internals = []
introspect-derive = ["dep:common-derive"]

[dependencies]
common-derive = { workspace = true, optional = true }
glam = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
ron = { workspace = true }
bitcode = { workspace = true }
tokio = { workspace = true, features = ["fs", "io-util", "rt"] }
uuid = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }

[dev-dependencies]
common = { workspace = true, features = ["internals", "introspect-derive"] }
tokio = { workspace = true, features = ["macros"] }
