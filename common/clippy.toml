# common is the one crate that reaches the file system, the environment, other processes and
# thread creation directly, so it holds the workspace's settings without the bans that send every
# other crate through it. Keep the rest of this file the same as the workspace's.
allow-print-in-tests = true
allowed-wildcard-imports = ["x86_64", "aarch64", "arch"]
absolute-paths-allowed-crates = ["std", "core", "alloc"]
disallowed-types = [
    { path = "std::thread::LocalKey", reason = "state lives on an owner and travels by parameter" },
    # A vector register is an architecture's own: kernels are generic over `simd::Isa`, and only
    # `simd`'s backends name a register. Each path resolves on its own architecture alone.
    { path = "std::arch::x86_64::__m128", reason = "vector code lives in the `simd` crate, the one place a platform difference lives", allow-invalid = true },
    { path = "std::arch::x86_64::__m128d", reason = "vector code lives in the `simd` crate, the one place a platform difference lives", allow-invalid = true },
    { path = "std::arch::x86_64::__m128i", reason = "vector code lives in the `simd` crate, the one place a platform difference lives", allow-invalid = true },
    { path = "std::arch::x86_64::__m256", reason = "vector code lives in the `simd` crate, the one place a platform difference lives", allow-invalid = true },
    { path = "std::arch::x86_64::__m256d", reason = "vector code lives in the `simd` crate, the one place a platform difference lives", allow-invalid = true },
    { path = "std::arch::x86_64::__m256i", reason = "vector code lives in the `simd` crate, the one place a platform difference lives", allow-invalid = true },
    { path = "std::arch::aarch64::float32x2_t", reason = "vector code lives in the `simd` crate, the one place a platform difference lives", allow-invalid = true },
    { path = "std::arch::aarch64::float32x4_t", reason = "vector code lives in the `simd` crate, the one place a platform difference lives", allow-invalid = true },
    { path = "std::arch::aarch64::float64x1_t", reason = "vector code lives in the `simd` crate, the one place a platform difference lives", allow-invalid = true },
    { path = "std::arch::aarch64::float64x2_t", reason = "vector code lives in the `simd` crate, the one place a platform difference lives", allow-invalid = true },
    { path = "std::arch::aarch64::int8x8_t", reason = "vector code lives in the `simd` crate, the one place a platform difference lives", allow-invalid = true },
    { path = "std::arch::aarch64::int8x16_t", reason = "vector code lives in the `simd` crate, the one place a platform difference lives", allow-invalid = true },
    { path = "std::arch::aarch64::int16x4_t", reason = "vector code lives in the `simd` crate, the one place a platform difference lives", allow-invalid = true },
    { path = "std::arch::aarch64::int16x8_t", reason = "vector code lives in the `simd` crate, the one place a platform difference lives", allow-invalid = true },
    { path = "std::arch::aarch64::int32x2_t", reason = "vector code lives in the `simd` crate, the one place a platform difference lives", allow-invalid = true },
    { path = "std::arch::aarch64::int32x4_t", reason = "vector code lives in the `simd` crate, the one place a platform difference lives", allow-invalid = true },
    { path = "std::arch::aarch64::int64x1_t", reason = "vector code lives in the `simd` crate, the one place a platform difference lives", allow-invalid = true },
    { path = "std::arch::aarch64::int64x2_t", reason = "vector code lives in the `simd` crate, the one place a platform difference lives", allow-invalid = true },
    { path = "std::arch::aarch64::uint8x8_t", reason = "vector code lives in the `simd` crate, the one place a platform difference lives", allow-invalid = true },
    { path = "std::arch::aarch64::uint8x16_t", reason = "vector code lives in the `simd` crate, the one place a platform difference lives", allow-invalid = true },
    { path = "std::arch::aarch64::uint16x4_t", reason = "vector code lives in the `simd` crate, the one place a platform difference lives", allow-invalid = true },
    { path = "std::arch::aarch64::uint16x8_t", reason = "vector code lives in the `simd` crate, the one place a platform difference lives", allow-invalid = true },
    { path = "std::arch::aarch64::uint32x2_t", reason = "vector code lives in the `simd` crate, the one place a platform difference lives", allow-invalid = true },
    { path = "std::arch::aarch64::uint32x4_t", reason = "vector code lives in the `simd` crate, the one place a platform difference lives", allow-invalid = true },
    { path = "std::arch::aarch64::uint64x1_t", reason = "vector code lives in the `simd` crate, the one place a platform difference lives", allow-invalid = true },
    { path = "std::arch::aarch64::uint64x2_t", reason = "vector code lives in the `simd` crate, the one place a platform difference lives", allow-invalid = true },
]

# A group's sampling is set through `common::bench::Scale`, the one policy every
# crate's cases share; `Scale::apply` alone calls these.
disallowed-methods = [
    { path = "criterion::BenchmarkGroup::sample_size", reason = "set a group's sampling through `common::bench::Scale`" },
    { path = "criterion::BenchmarkGroup::warm_up_time", reason = "set a group's sampling through `common::bench::Scale`" },
    { path = "criterion::BenchmarkGroup::measurement_time", reason = "set a group's sampling through `common::bench::Scale`" },
    { path = "criterion::BenchmarkGroup::sampling_mode", reason = "set a group's sampling through `common::bench::Scale`" },
]
