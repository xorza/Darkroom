[package]
name = "darkroom"
version.workspace = true
edition.workspace = true
exclude = ["AGENTS.md", "CLAUDE.md"]

[lints]
workspace = true

[lib]
bench = false

# Its docs would collide with the library's, of the same name.
[[bin]]
name = "darkroom"
path = "src/main.rs"
doc = false

[[bench]]
name = "darkroom"
harness = false
required-features = ["internals"]

[dependencies]
palantir = { workspace = true }
scenarium = { workspace = true }
common = { workspace = true }
lens = { workspace = true }
imaginarium = { workspace = true }

image = { workspace = true, features = ["png"] }
glam = { workspace = true, features = ["serde", "std"] }
serde = { workspace = true, features = ["derive", "std"] }
thiserror = { workspace = true }
ron = { workspace = true }
rfd = { workspace = true, features = ["wayland", "xdg-portal"] }
zip = { workspace = true, features = ["deflate"] }
tokio = { workspace = true, features = ["rt-multi-thread"] }
clap = { workspace = true, features = [
    "derive",
    "error-context",
    "help",
    "std",
    "suggestions",
    "usage",
] }
tracing = { workspace = true, features = ["std"] }
tracing-subscriber = { workspace = true, features = [
    "ansi",
    "env-filter",
    "fmt",
    "std",
    "tracing-log",
] }
criterion = { workspace = true, optional = true, features = ["cargo_bench_support"] }

[dev-dependencies]
imaginarium = { workspace = true, features = ["internals"] }
darkroom = { workspace = true, features = ["internals"] }
palantir = { workspace = true, features = ["internals"] }
common = { workspace = true, features = ["internals"] }
scenarium = { workspace = true, features = ["internals"] }
static_assertions = { workspace = true }
tokio = { workspace = true, features = ["macros"] }

[features]
internals = ["dep:criterion", "palantir/internals"]
profile-with-tracy = ["palantir/profile-with-tracy"]

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { workspace = true }
objc2-app-kit = { workspace = true, features = ["NSApplication", "NSResponder"] }
objc2-foundation = { workspace = true, features = ["NSArray", "NSString", "NSURL"] }

# Embeds the app icon in the .exe; a no-op off Windows.
[target.'cfg(windows)'.build-dependencies]
winresource = { workspace = true, features = ["toml"] }

# Regenerate the icons with scripts/generate-icons.sh.
[package.metadata.bundle]
name = "darkroom"
identifier = "com.cssodessa.darkroom"
icon = [
    "assets/icons/darkroom.icns",
    "assets/icons/darkroom-512.png",
    "assets/icons/darkroom-256.png",
    "assets/icons/darkroom-128.png",
]
category = "GraphicsDesign"
short_description = "Node-graph image pipeline editor"
