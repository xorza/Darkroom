[package]
name = "darkroom"
version.workspace = true
edition.workspace = true
exclude = ["AGENTS.md", "CLAUDE.md"]

[lib]
bench = false

[[bench]]
harness = false
name = "darkroom"
required-features = ["internals"]

[dependencies]
blake3 = { workspace = true, features = ["std"] }
common = { workspace = true }
criterion = { workspace = true, optional = true, features = ["cargo_bench_support"] }
glam = { workspace = true, features = ["serde", "std"] }
imaginarium = { workspace = true }
lens = { workspace = true }
libraw = { workspace = true }
notify = { workspace = true }
palantir = { workspace = true, features = ["png"] }
rfd = { workspace = true, features = ["wayland", "xdg-portal"] }
ron = { workspace = true }
scenarium = { workspace = true }
serde = { workspace = true, features = ["derive", "std"] }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread"] }
tracing = { workspace = true, features = ["std"] }
zip = { workspace = true, features = ["deflate"] }

[dependencies.tracing-subscriber]
features = ["ansi", "env-filter", "fmt", "std", "tracing-log"]
workspace = true

[dev-dependencies]
common = { workspace = true, features = ["internals"] }
darkroom = { workspace = true, features = ["internals"] }
imaginarium = { workspace = true, features = ["internals"] }
palantir = { workspace = true, features = ["internals"] }
scenarium = { workspace = true, features = ["internals"] }
static_assertions = { workspace = true }
tokio = { workspace = true, features = ["macros"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { workspace = true }
objc2-app-kit = { workspace = true, features = ["NSApplication", "NSResponder"] }
objc2-foundation = { workspace = true, features = ["NSArray", "NSString", "NSURL"] }

[features]
internals = ["dep:criterion", "palantir/internals", "scenarium/internals"]
profile-with-tracy = ["palantir/profile-with-tracy"]

[lints]
workspace = true
