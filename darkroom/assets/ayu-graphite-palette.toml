# Ayu Graphite — dark semantic palette.
#
# GENERATED by tools/build_palettes.py from assets/ayu-graphite-base.toml, which is
# the single source of truth. Edit that file, not this one.
#
# A direct projection: every value is the primitive its role names in the base,
# with the ref followed.

[backgrounds]
# Chrome layers. Each step must stay distinguishable from the one under
# it — a control that shares its fill with the panel it sits on
# disappears. `terminal_bg` is one rung below `bg`: the terminal pane in
# an editor, the graph canvas in darkroom.
terminal_bg = "#161514"
bg = "#1f1e1d"
panel = "#282726"
surface = "#323130"
elem = "#323130"
elem_hover = "#3d3c3b"
elem_active = "#484745"
elem_disabled = "#282726"
title_bar = "#323130"
title_bar_inactive = "#282726"
chat_msg_bg = "#323130"
overlay_black = "#000000"

[borders]
border = "#3d3c3b"
border_focused = "#105577"

[text]
# `on_accent` is the ink for anything drawn on a bright fill — accent
# buttons, unread badges, status chips. `text` never clears 2:1 on one.
text = "#e2dfd3"
text_muted = "#aaaaa8"
text_disabled = "#878a8d"
on_accent = "#1f1e1d"
on_accent_muted = "#14556b"

[accent_status]
accent = "#59d4ff"
accent_hover = "#7fdfff"
accent_active = "#3fbde8"
success = "#daff58"
warning = "#ffd44a"
error = "#ff6b52"
hint = "#77adbc"

[selection]
selection_bg = "#123a5c"
selection_fg = "#e2dfd3"

[status_bg]
info_bg = "#2c4a60"
info_border = "#4a8ab0"
hint_bg = "#0f3e58"
hint_border = "#105577"
success_bg = "#486a15"
success_border = "#668a2f"
warning_bg = "#5f4617"
warning_border = "#81632b"
error_bg = "#4f191a"
error_border = "#703130"
diagnostic_muted_bg = "#4c515a"

[diff]
# `created` / `deleted` restate success / error; the `term_` pair is the
# louder terminal-pane variant.
diff_created = "#daff58"
diff_created_bg = "#486a15"
diff_deleted = "#ff6b52"
diff_deleted_bg = "#4f191a"
diff_term_plus = "#daff58"
diff_term_minus = "#ff6b52"

[editor]
line_number = "#70747a"
line_number_active = "#f6f6f6"
line_number_hover = "#c7c6bf"
scrollbar_thumb = "#aaaaa8"
drop_target = "#aaaaa8"
search_highlight = "#7adcf3"
search_match_active = "#ff7d2d"

[ansi]
# Bright is lighter than normal, dim is darker, per hue — in both modes.
# This family does not mirror: black stays the dark end and white the
# light end, or every program that hardcodes a colour comes out wrong.
ansi_black = "#1f1e1d"
ansi_red = "#ff6b52"
ansi_green = "#daff58"
ansi_yellow = "#ffd44a"
ansi_blue = "#5985a3"
ansi_magenta = "#d897ff"
ansi_cyan = "#98e1f3"
ansi_white = "#e2dfd3"
ansi_bright_black = "#70747a"
ansi_bright_red = "#ff8f7a"
ansi_bright_green = "#eaff9a"
ansi_bright_yellow = "#ffe79b"
ansi_bright_blue = "#59d4ff"
ansi_bright_magenta = "#e8c2ff"
ansi_bright_cyan = "#c6f0fa"
ansi_bright_white = "#ffffff"
ansi_dim_black = "#000000"
ansi_dim_red = "#b05043"
ansi_dim_green = "#75a228"
ansi_dim_yellow = "#ba913b"
ansi_dim_blue = "#3d5f75"
ansi_dim_magenta = "#7d4a96"
ansi_dim_cyan = "#4f8fa3"
ansi_dim_white = "#aaaaa8"

[misc]
player_bg = "#878a8d"
chat_check = "#daff58"

[syntax]
syn_keyword = "#ffa63d"
syn_function = "#ffd44a"
syn_string = "#daff58"
syn_string_regex = "#69ffd1"
syn_comment = "#878a8d"
syn_number = "#d897ff"
syn_type = "#7adcf3"
syn_operator = "#ffa63d"
syn_attribute = "#7adcf3"
syn_punctuation = "#c7c6bf"
syn_doc = "#aaaaa8"
syn_string_special = "#ffdd8c"
syn_predictive = "#7091b3"
