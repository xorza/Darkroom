# Ayu Light — light semantic palette.
#
# GENERATED by tools/build_palettes.py from assets/ayu-graphite-base.toml, which is
# the single source of truth. Edit that file, not this one.
#
# Derived, not hand-picked: each role goes through an OKLCH transform chosen by
# its class — surfaces mirror into a near-white ramp, inks keep their distance
# from the background, hues compress toward a mid band and gain the chroma a
# light surface needs, status tints wash out to near-white, and ANSI keeps its
# absolute black-to-white ordering. The rules and their fitted constants live at
# the top of the generator.

[backgrounds]
# Chrome layers. Each step must stay distinguishable from the one under
# it — a control that shares its fill with the panel it sits on
# disappears. `terminal_bg` is one rung below `bg`: the terminal pane in
# an editor, the graph canvas in darkroom.
terminal_bg = "#fdfbfa"
bg = "#f5f3f2"
panel = "#edecea"
surface = "#e5e3e2"
elem = "#e5e3e2"
elem_hover = "#dcdbd9"
elem_active = "#d4d2d0"
elem_disabled = "#edecea"
title_bar = "#e5e3e2"
title_bar_inactive = "#edecea"
chat_msg_bg = "#e5e3e2"
overlay_black = "#000000"

[borders]
border = "#cac9c7"
border_focused = "#bae1fa"

[text]
# `on_accent` is the ink for anything drawn on a bright fill — accent
# buttons, unread badges, status chips. `text` never clears 2:1 on one.
text = "#68665e"
text_muted = "#898987"
text_disabled = "#9ea0a3"
on_accent = "#1f1e1d"
on_accent_muted = "#14556b"

[accent_status]
accent = "#42b0d5"
accent_hover = "#4da2bd"
accent_active = "#5cc6ed"
success = "#a3c226"
warning = "#cba626"
error = "#e6634d"
hint = "#6c95a1"

[selection]
selection_bg = "#dceeff"
selection_fg = "#68665e"

[status_bg]
info_bg = "#dfedf9"
info_border = "#bae1fb"
hint_bg = "#dbeefc"
hint_border = "#bae1fa"
success_bg = "#e1f2d0"
success_border = "#cce5ae"
warning_bg = "#f6e9d5"
warning_border = "#edd8b5"
error_bg = "#ffe4e2"
error_border = "#fecdca"
diagnostic_muted_bg = "#e9ebf0"

[diff]
# `created` / `deleted` restate success / error; the `term_` pair is the
# louder terminal-pane variant.
diff_created = "#a3c226"
diff_created_bg = "#e1f2d0"
diff_deleted = "#e6634d"
diff_deleted_bg = "#ffe4e2"
diff_term_plus = "#a3c226"
diff_term_minus = "#e6634d"

[editor]
line_number = "#adb1b6"
line_number_active = "#585858"
line_number_hover = "#777671"
scrollbar_thumb = "#898987"
drop_target = "#898987"
search_highlight = "#5db3c7"
search_match_active = "#e2702b"

[ansi]
# Bright is lighter than normal, dim is darker, per hue — in both modes.
# This family does not mirror: black stays the dark end and white the
# light end, or every program that hardcodes a colour comes out wrong.
ansi_black = "#2e2d2c"
ansi_red = "#e6634d"
ansi_green = "#a3c226"
ansi_yellow = "#cba626"
ansi_blue = "#45708d"
ansi_magenta = "#b980db"
ansi_cyan = "#74b4c3"
ansi_white = "#a7a499"
ansi_bright_black = "#60646a"
ansi_bright_red = "#dd7a68"
ansi_bright_green = "#aec068"
ansi_bright_yellow = "#c5b06e"
ansi_bright_blue = "#42b0d5"
ansi_bright_magenta = "#ba99ce"
ansi_bright_cyan = "#89b1bb"
ansi_bright_white = "#b7b7b7"
ansi_dim_black = "#0b0b0b"
ansi_dim_red = "#b76053"
ansi_dim_green = "#729a33"
ansi_dim_yellow = "#ac883e"
ansi_dim_blue = "#37586e"
ansi_dim_magenta = "#8e60a6"
ansi_dim_cyan = "#37788b"
ansi_dim_white = "#858583"

[misc]
player_bg = "#9ea0a3"
chat_check = "#a3c226"

[syntax]
syn_keyword = "#d88a2d"
syn_function = "#cba626"
syn_string = "#a3c226"
syn_string_regex = "#40c8a1"
syn_comment = "#9ea0a3"
syn_number = "#b980db"
syn_type = "#5db3c7"
syn_operator = "#d88a2d"
syn_attribute = "#5db3c7"
syn_punctuation = "#777671"
syn_doc = "#898987"
