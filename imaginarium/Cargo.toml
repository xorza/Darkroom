[package]
name = "imaginarium"
version.workspace = true
edition.workspace = true
description = "Image processing with CPU (SIMD) and GPU (wgpu compute) backends: interleaved images in nine pixel formats, and f32 planes."
license = "MIT OR Apache-2.0"
exclude = ["AGENTS.md", "CLAUDE.md"]

[lints]
workspace = true

[features]
default = []
wgpu = ["dep:wgpu", "dep:pollster", "dep:tokio"]
internals = ["common/internals", "dep:criterion", "simd/internals"]

[dependencies]
simd = { workspace = true }
common = { workspace = true }
wgpu = { workspace = true, optional = true, features = [
    "dx12",
    "metal",
    "parking_lot",
    "std",
    "vulkan",
    "wgsl",
] }
pollster = { workspace = true, optional = true }
tokio = { workspace = true, optional = true, features = ["sync"] }
thiserror = { workspace = true, features = ["std"] }
bytemuck = { workspace = true, features = ["derive", "extern_crate_std", "min_const_generics"] }
glam = { workspace = true, features = ["bytemuck", "std", "u32", "usize"] }
rayon = { workspace = true }
serde = { workspace = true, features = ["derive", "std"] }
strum = { workspace = true, features = ["derive", "std"] }
tiff = { workspace = true, features = ["deflate", "fax", "jpeg", "lzw"] }
image = { workspace = true, features = ["jpeg", "png", "tiff"] }
criterion = { workspace = true, optional = true, features = ["cargo_bench_support"] }

[dev-dependencies]
common = { workspace = true, features = ["internals"] }
imaginarium = { workspace = true, features = ["internals"] }

[[example]]
name = "affine_warp"
required-features = ["wgpu"]

[[example]]
name = "pipeline"
required-features = ["wgpu"]

[lib]
bench = false

[[bench]]
name = "imaginarium"
harness = false
required-features = ["internals"]
