[package]
name = "imaginarium"
version.workspace = true
edition.workspace = true
exclude = ["AGENTS.md", "CLAUDE.md"]
license = "MIT OR Apache-2.0"
description = """
Image processing with CPU (SIMD) and GPU (wgpu compute) backends: interleaved
images in nine pixel formats, and f32 planes.
"""

[lib]
bench = false

[[example]]
name = "affine_warp"
required-features = ["wgpu"]

[[example]]
name = "pipeline"
required-features = ["wgpu"]

[[bench]]
harness = false
name = "imaginarium"
required-features = ["internals"]

[dependencies]
bytemuck = { workspace = true, features = ["derive", "extern_crate_std", "min_const_generics"] }
common = { workspace = true }
criterion = { workspace = true, optional = true, features = ["cargo_bench_support"] }
glam = { workspace = true, features = ["bytemuck", "std", "u32", "usize"] }
image = { workspace = true, features = ["jpeg", "png", "tiff"] }
pollster = { workspace = true, optional = true }
rayon = { workspace = true }
serde = { workspace = true, features = ["derive", "std"] }
simd = { workspace = true }
strum = { workspace = true, features = ["derive", "std"] }
thiserror = { workspace = true, features = ["std"] }
tiff = { workspace = true, features = ["deflate", "fax", "jpeg", "lzw"] }
tokio = { workspace = true, optional = true, features = ["sync"] }

[dependencies.wgpu]
features = ["metal", "parking_lot", "std", "vulkan", "wgsl"]
optional = true
workspace = true

[dev-dependencies]
common = { workspace = true, features = ["internals"] }
imaginarium = { workspace = true, features = ["internals"] }

[features]
internals = ["common/internals", "dep:criterion", "simd/internals"]
wgpu = ["dep:wgpu", "dep:pollster", "dep:tokio"]

[lints]
workspace = true
