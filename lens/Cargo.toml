[package]
name = "lens"
version.workspace = true
edition.workspace = true
exclude = ["AGENTS.md", "CLAUDE.md"]

[dependencies]
blake3 = { workspace = true, features = ["std"] }
common = { workspace = true, features = ["introspect-derive"] }
glam = { workspace = true, features = ["std"] }
imaginarium = { workspace = true }
lumos = { workspace = true, features = ["ml"] }
notify = { workspace = true }
scenarium = { workspace = true }
serde = { workspace = true, features = ["derive", "std"] }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["rt", "sync", "time"] }
tracing = { workspace = true, features = ["std"] }

[dev-dependencies]
common = { workspace = true, features = ["internals"] }
imaginarium = { workspace = true, features = ["internals"] }
lumos = { workspace = true, features = ["internals"] }
scenarium = { workspace = true, features = ["internals"] }
tokio = { workspace = true, features = ["macros", "test-util"] }

[lints]
workspace = true
