[package]
name = "lens"
version.workspace = true
edition.workspace = true
exclude = ["AGENTS.md", "CLAUDE.md"]

[lints]
workspace = true

[dependencies]
common = { workspace = true, features = ["introspect-derive"] }
scenarium = { workspace = true }
imaginarium = { workspace = true }
lumos = { workspace = true, features = ["ml"] }
thiserror = { workspace = true }
strum = { workspace = true }
tracing = { workspace = true, features = ["std"] }
tokio = { workspace = true, features = ["io-util", "rt", "sync", "time"] }
async-trait = { workspace = true }
notify = { workspace = true }
rand = { workspace = true, features = ["std_rng", "thread_rng"] }
blake3 = { workspace = true, features = ["std"] }
serde = { workspace = true, features = ["derive", "std"] }

[dev-dependencies]
imaginarium = { workspace = true, features = ["internals"] }
common = { workspace = true, features = ["internals"] }
scenarium = { workspace = true, features = ["internals"] }
tokio = { workspace = true, features = ["macros", "test-util"] }
