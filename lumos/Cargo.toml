[package]
name = "lumos"
version.workspace = true
edition.workspace = true
description = "Astronomical image-processing pipeline: RAW/FITS decode, calibration, star detection, registration, stacking, and drizzle."
exclude = ["AGENTS.md", "CLAUDE.md"]

[lints]
workspace = true

[features]
real-data = []
ml = ["dep:ort"]
internals = ["common/internals", "dep:criterion"]

[dependencies]
common = { workspace = true, features = ["introspect-derive"] }
imaginarium = { workspace = true }

ort = { workspace = true, optional = true, features = [
    "api-31",
    "download-binaries",
    "std",
    "tls-native",
    "tracing",
] }

fits-well = { workspace = true }
libraw = { workspace = true }

thiserror = { workspace = true }
bytemuck = { workspace = true, features = ["derive", "extern_crate_alloc"] }
rayon = { workspace = true }
tracing = { workspace = true, features = ["std"] }
glam = { workspace = true, features = ["f64", "serde", "std"] }
serde = { workspace = true, features = ["derive", "std"] }
rand = { workspace = true }
rand_chacha = { workspace = true }
nalgebra = { workspace = true, features = ["std"] }
statrs = { workspace = true }
arrayvec = { workspace = true, features = ["serde"] }
blake3 = { workspace = true, features = ["std"] }
criterion = { workspace = true, optional = true, features = ["cargo_bench_support"] }

[dev-dependencies]
libraw = { workspace = true, features = ["internals"] }
imaginarium = { workspace = true, features = ["internals"] }
common = { workspace = true, features = ["internals"] }
image = { workspace = true, features = ["png"] }
lumos = { workspace = true, features = ["internals"] }
tracing-subscriber = { workspace = true, features = ["env-filter", "fmt", "std"] }

[lib]
bench = false

[[bench]]
name = "lumos"
harness = false
required-features = ["internals"]
