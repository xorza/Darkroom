[package]
name = "lumos"
version.workspace = true
edition.workspace = true
description = "Astronomical image-processing pipeline: RAW/FITS decode, calibration, star detection, registration, stacking, and drizzle."
exclude = ["AGENTS.md", "CLAUDE.md"]

[lints]
workspace = true

[features]
real-data = []
ml = ["dep:ort"]
# `libc` drops a spilled frame's pages from the page cache, for the benches of cold reads on Linux.
internals = ["common/internals", "dep:criterion", "dep:libc"]

[dependencies]
common = { workspace = true, features = ["introspect-derive"] }
imaginarium = { workspace = true }

ort = { workspace = true, optional = true }

fits-well = { workspace = true }
libraw-sys = { workspace = true }

thiserror = { workspace = true }
bytemuck = { workspace = true }
rayon = { workspace = true }
tracing = { workspace = true }
glam = { workspace = true }
serde = { workspace = true }
memmap2 = { workspace = true }
sysinfo = { workspace = true }
rand = { workspace = true }
rand_chacha = { workspace = true }
nalgebra = { workspace = true }
statrs = { workspace = true }
arrayvec = { workspace = true }
blake3 = { workspace = true }
criterion = { workspace = true, optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
libc = { workspace = true, optional = true }

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_JobObjects",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
] }

[dev-dependencies]
common = { workspace = true, features = ["internals"] }
image = { workspace = true }
lumos = { workspace = true, features = ["internals"] }
tracing-subscriber = { workspace = true }

[lib]
bench = false

[[bench]]
name = "lumos"
harness = false
required-features = ["internals"]
