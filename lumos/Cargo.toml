[package]
name = "lumos"
version.workspace = true
edition.workspace = true
exclude = ["AGENTS.md", "CLAUDE.md"]
description = """
Astronomical image-processing pipeline: RAW/FITS decode, calibration, star
detection, registration, stacking, and drizzle.
"""

[lib]
bench = false

[[bench]]
harness = false
name = "lumos"
required-features = ["internals"]

[dependencies]
arrayvec = { workspace = true, features = ["serde"] }
blake3 = { workspace = true, features = ["std"] }
bytemuck = { workspace = true, features = ["derive"] }
common = { workspace = true, features = ["introspect-derive"] }
criterion = { workspace = true, optional = true, features = ["cargo_bench_support"] }
fits-well = { workspace = true }
glam = { workspace = true, features = ["f64", "i32", "serde", "std", "u32", "usize"] }
imaginarium = { workspace = true }
libraw = { workspace = true }
nalgebra = { workspace = true, features = ["libm-force", "std"] }
rayon = { workspace = true }
serde = { workspace = true, features = ["derive", "std"] }
simd = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true, features = ["std"] }

[dependencies.ort]
features = ["api-28", "download-binaries", "std", "tls-native", "tracing"]
optional = true
workspace = true

[dev-dependencies]
common = { workspace = true, features = ["internals"] }
fits-well = { workspace = true, features = ["internals"] }
image = { workspace = true, features = ["png"] }
imaginarium = { workspace = true, features = ["internals"] }
libraw = { workspace = true, features = ["internals"] }
lumos = { workspace = true, features = ["internals"] }
simd = { workspace = true, features = ["internals"] }
statrs = { workspace = true }

[features]
internals = ["common/internals", "dep:criterion", "simd/internals"]
ml = ["dep:ort"]
real-data = []

[lints]
workspace = true
