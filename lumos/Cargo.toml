[package]
name = "lumos"
version.workspace = true
edition.workspace = true
description = "Astronomical image-processing pipeline: RAW/FITS decode, calibration, star detection, registration, stacking, and drizzle."
exclude = ["AGENTS.md", "CLAUDE.md"]

[lints]
workspace = true

[features]
real-data = []
ml = ["dep:ort"]
# Compiles the colocated `bench.rs` drivers (quickbench `#[test] #[ignore]` benches) and the
# helpers only they reach. Not part of the supported surface.
bench = []

[dependencies]
common = { workspace = true, features = ["introspect-derive"] }
imaginarium = { workspace = true }

ort = { workspace = true, optional = true }

fits-well = { workspace = true }
libraw-sys = { workspace = true }

thiserror = { workspace = true }
bytemuck = { workspace = true }
rayon = { workspace = true }
tracing = { workspace = true }
glam = { workspace = true }
serde = { workspace = true }
memmap2 = { workspace = true }
sysinfo = { workspace = true }
rand = { workspace = true }
rand_chacha = { workspace = true }
nalgebra = { workspace = true }
statrs = { workspace = true }
arrayvec = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_JobObjects",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
] }

[dev-dependencies]
blake3 = { workspace = true }
common = { workspace = true, features = ["internals"] }
quickbench = { workspace = true }
image = { workspace = true }
tracing-subscriber = { workspace = true }
