[package]
name = "scenarium"
version.workspace = true
edition.workspace = true
description = "A graph library for Darkroom"
exclude = ["AGENTS.md", "CLAUDE.md"]

[lints]
workspace = true

[dependencies]
common = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }
strum = { workspace = true }
tokio = { workspace = true, features = ["fs", "io-util", "macros", "rt", "sync", "time"] }
tokio-util = { workspace = true }
tracing = { workspace = true }
hashbrown = { workspace = true }
async-trait = { workspace = true }
blake3 = { workspace = true }

[features]
internals = []

[dev-dependencies]
common = { workspace = true, features = ["internals"] }
scenarium = { workspace = true, features = ["internals"] }
ron = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "test-util"] }
