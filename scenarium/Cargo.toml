[package]
name = "scenarium"
version.workspace = true
edition.workspace = true
exclude = ["AGENTS.md", "CLAUDE.md"]
description = "A graph library for Darkroom"

[dependencies]
blake3 = { workspace = true, features = ["std"] }
common = { workspace = true }
futures-util = { workspace = true }
hashbrown = { workspace = true, features = ["default-hasher", "inline-more", "serde"] }
serde = { workspace = true, features = ["derive", "std"] }
strum = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "sync", "time"] }
tokio-util = { workspace = true, features = ["rt"] }
tracing = { workspace = true, features = ["std"] }

[dev-dependencies]
common = { workspace = true, features = ["internals"] }
ron = { workspace = true }
scenarium = { workspace = true, features = ["internals"] }
tokio = { workspace = true, features = ["rt-multi-thread", "test-util"] }

[features]
internals = []

[lints]
workspace = true
