[package]
name = "scenarium"
version.workspace = true
edition.workspace = true
description = "A graph library for Darkroom"
exclude = ["AGENTS.md", "CLAUDE.md"]

[lints]
workspace = true

[dependencies]
common = { workspace = true }
serde = { workspace = true, features = ["derive", "std"] }
thiserror = { workspace = true }
strum = { workspace = true }
tokio = { workspace = true, features = ["fs", "io-util", "macros", "rt", "sync", "time"] }
tokio-util = { workspace = true, features = ["rt"] }
tracing = { workspace = true, features = ["std"] }
hashbrown = { workspace = true, features = ["default-hasher", "inline-more", "serde"] }
async-trait = { workspace = true }
blake3 = { workspace = true, features = ["std"] }

[features]
internals = []

[dev-dependencies]
common = { workspace = true, features = ["internals"] }
scenarium = { workspace = true, features = ["internals"] }
ron = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "test-util"] }
