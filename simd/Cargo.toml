[package]
name = "simd"
version.workspace = true
edition.workspace = true
exclude = ["AGENTS.md", "CLAUDE.md"]
description = """
Vector kernels written once, for every CPU: every SIMD instruction of the
workspace.
"""

[dev-dependencies]
libm = { workspace = true }
simd = { workspace = true, features = ["internals"] }

[features]
# The portable backend on aarch64, which never dispatches to it, and the tier walk the tests and
# benches of other crates take.
internals = []

[lints]
workspace = true
